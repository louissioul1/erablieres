<style>
/* VOICE: outil de terrain, lisible au soleil, gros boutons pour les gants
   IDEA: la carte d'érablière qu'on garde dans le camion, annotée au crayon
   PICTURE: la carte satellite plein écran avec les maîtres-lignes par-dessus
   COLOUR and TYPE: vert forêt profond, rouge érable en accent, blanc; Barlow + Barlow Condensed
   LAYOUT: carte plein écran, menus cachés (tiroir à gauche, fiches qui montent du bas) */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1712);--panel:light-dark(#ffffff,#131d17);--ink:light-dark(#18231c,#e8efe9);--mute:light-dark(#5d6b62,#9aaa9f);
--line:light-dark(#dfe5e0,#26332b);--forest:light-dark(#1f4a33,#7fc39a);--maple:#c8361f;--map:light-dark(#eef2ec,#16211a);--chip:light-dark(#f1f4f1,#1b2820)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--map);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#map{position:fixed;inset:0;background:var(--map)}
.leaflet-container{background:var(--map);font:inherit}
.leaflet-interactive:focus{outline:none}
.topbar{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;z-index:700;display:flex;gap:8px;align-items:center;pointer-events:none}
.topbar>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px 0 4px;border-radius:24px;background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.2);border:1px solid var(--line)}
.pill h1{font:700 19px/1 "Barlow Condensed",sans-serif;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{position:relative;width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:22px;height:22px}
.bn{position:absolute;top:2px;right:2px;background:var(--maple);color:#fff;border-radius:9px;font:700 11px Barlow;min-width:18px;height:18px;padding:0 4px;display:none;place-items:center}
.sync{font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:#9fb3a6;flex:none}.dot.ok{background:#3fbf72}.dot.warn{background:#f0a400}
.fab{position:fixed;right:14px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:600;display:flex;align-items:center;gap:8px;padding:0 20px;height:56px;border:0;border-radius:28px;background:var(--maple);color:#fff;font:700 19px "Barlow Condensed";box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer}
.fab svg{width:22px;height:22px}
.maptools{position:fixed;left:10px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:600;display:flex;flex-direction:column;gap:8px}
.mbtn{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.mbtn svg{width:22px;height:22px}
.mbtn.on{background:#2563c9;color:#fff;border-color:#2563c9}
.mbtn.follow{background:#2563c9;color:#fff;box-shadow:0 0 0 4px rgba(37,99,201,.35)}
.banner{position:fixed;left:50%;top:calc(68px + env(safe-area-inset-top));transform:translateX(-50%);z-index:750;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;display:none;max-width:90%;text-align:center}
.banner.on{display:block}
.pop{position:fixed;top:calc(66px + env(safe-area-inset-top));right:10px;z-index:740;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.25);display:none;min-width:210px}
.pop.on{display:block}
.pop h3{font:700 15px "Barlow Condensed";margin:4px 0 6px}
.legend{font-size:13px;line-height:1.8}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.gpsinfo{position:fixed;left:10px;top:calc(66px + env(safe-area-inset-top));z-index:600;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.gpsinfo.on{display:block}
.etool{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:720;display:none;gap:6px;background:var(--panel);padding:6px;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.3);border:1px solid var(--line);width:max-content;max-width:calc(100vw - 20px);flex-wrap:wrap;justify-content:center}
.etool.on{display:flex}
.leaflet-top{top:calc(62px + env(safe-area-inset-top))}
.leaflet-bottom.leaflet-left{left:64px;bottom:calc(10px + env(safe-area-inset-bottom))}
.leaflet-control-attribution{font-size:10px}
aside{position:fixed;top:0;bottom:0;left:0;width:min(420px,92vw);z-index:1100;background:var(--panel);display:flex;flex-direction:column;min-height:0;box-shadow:4px 0 24px rgba(0,0,0,.3);transform:translateX(-105%);transition:transform .22s ease;padding-top:env(safe-area-inset-top)}
aside.open{transform:none}
.dscrim{position:fixed;inset:0;z-index:1050;background:rgba(0,0,0,.35);display:none}.dscrim.on{display:block}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 4px 18px}
.dhead b{font:700 22px "Barlow Condensed"}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;padding:0 12px;height:48px;border:0;background:none;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--forest);border-color:var(--forest)}
.view{flex:1;overflow:auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--chip);border-radius:10px;padding:10px}
.kpi b{display:block;font:700 26px/1 "Barlow Condensed";color:var(--forest)}
.kpi span{font-size:13px;color:var(--mute)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer;min-height:38px}
.chip[aria-pressed=true]{background:var(--forest);color:var(--bg);border-color:var(--forest)}
.item{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--chip)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.meta{font-size:13px;color:var(--mute)}
.item p{margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tfoot td{font-weight:700;border-bottom:0}
.empty{color:var(--mute);padding:24px 4px;text-align:center}
.h2{font:700 22px/1.1 "Barlow Condensed";margin:4px 0 10px}
.small{font-size:13px;color:var(--mute)}
.btn{min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--chip);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative}
.btn.pri{background:var(--forest);color:var(--bg);border-color:var(--forest)}
.btn.red{color:var(--maple)}
.btn input[type=file]{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:3px solid var(--maple);outline-offset:2px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1200;display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{background:var(--panel);width:min(560px,100%);max-height:92dvh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:761px){.scrim{align-items:center}.sheet{border-radius:16px}}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{width:100%;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-height:46px}
textarea{min-height:84px;resize:vertical}
.types{display:flex;flex-wrap:wrap;gap:6px}
.pico{border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 5px #0009;display:grid;place-items:center;box-sizing:border-box}
.icogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.icob{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:6px 8px;font-size:13px;text-align:left;cursor:pointer;color:inherit}
.icob[aria-pressed=true]{outline:3px solid var(--ink);background:var(--card,#fff)}
.pos{background:var(--chip);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:8px}
.big{width:100%;border-radius:10px;margin:6px 0;display:block;background:var(--chip);min-height:120px}
img.ploading{background:linear-gradient(90deg,var(--chip) 25%,color-mix(in srgb,var(--chip) 60%,#fff) 50%,var(--chip) 75%);background-size:200% 100%;animation:pl 1.4s infinite linear}@keyframes pl{to{background-position:-200% 0}}
.err{color:var(--maple);font-weight:600;font-size:14px;margin-top:8px}
.ok{color:var(--forest);font-weight:600;font-size:14px;margin-top:8px}
.leaflet-tooltip.lbl{background:transparent;border:0;box-shadow:none;font:700 13px "Barlow Condensed";color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.leaflet-tooltip.lblo{color:#ffd27a;font-size:16px;cursor:pointer;pointer-events:auto}
.base-plan .leaflet-tooltip.lbl{color:#18231c;text-shadow:0 0 3px #fff,0 0 3px #fff}
.leaflet-tooltip.lbl::before{display:none}
.lf{flex:none;display:block}
.sectbtn{display:flex;align-items:center;gap:4px;border:0;background:none;padding:0;cursor:pointer;min-height:44px;color:inherit}
.sitem{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:46px;padding:0 12px;border:0;border-radius:10px;background:none;font-weight:600;cursor:pointer;text-align:left}
.sitem[aria-pressed=true]{background:var(--forest);color:var(--bg)}.sitem[aria-pressed=true] .meta{color:inherit}
.sitem.add{color:var(--maple)}
.gate{position:fixed;inset:0;z-index:2000;background:#1f4a33;color:#fff;display:none;align-items:center;justify-content:center;padding:24px}
.gate.on{display:flex}
.gate .card{background:var(--panel);color:var(--ink);border-radius:16px;padding:22px;width:min(400px,100%)}
.gate h2{font:700 30px/1.05 "Barlow Condensed";margin:0 0 4px}
@media(max-width:760px){.leaflet-control-zoom{display:none}#synctxt{display:none}}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>

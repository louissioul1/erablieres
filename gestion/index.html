<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f6f5f0,#0e1511);--card:light-dark(#ffffff,#151f19);--ink:light-dark(#18231c,#e8efe9);--mute:light-dark(#5d6b62,#9aaa9f);
--line:light-dark(#e3e6df,#26332b);--forest:#24533b;--forest2:#2f6a4b;--leaf:#2fa85f;--gold:#efba59;--maple:#c8361f;--chip:light-dark(#f0f2ee,#1b2820);
--o:#e08a00;--b:#3d7bd9}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;letter-spacing:.2px;margin:0}
header{background:var(--forest);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px #0003}
.top{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.logo{width:42px;height:42px;border-radius:10px;background:#141414;display:grid;place-items:center;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:19px;font-family:"Barlow Condensed";line-height:1.1}
.sect{background:none;border:0;color:#ffffffcc;padding:0;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:4px}
.hbtn{border:0;border-radius:10px;padding:9px 13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn.g{background:var(--leaf);color:#fff}.hbtn.y{background:var(--gold);color:#3a2a00}.hbtn.t{background:#ffffff1f;color:#fff}
nav{display:flex;gap:2px;max-width:1100px;margin:8px auto 0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1;min-width:76px;background:none;border:0;color:#ffffffb3;padding:7px 4px 9px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:#fff;border-bottom-color:var(--gold);font-weight:600}
nav svg{width:20px;height:20px}
@media (max-width:760px){
 nav{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--forest);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:60;box-shadow:0 -2px 10px #0003}
 nav button{min-width:0;font-size:11px;border-bottom:0;border-top:3px solid transparent;padding:6px 2px}
 nav button[aria-selected=true]{border-top-color:var(--gold)}
 .hide-m{display:none!important}
}
main{max-width:1100px;margin:0 auto;padding:16px 14px 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:22px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;min-height:42px}
.btn.pri{background:var(--forest);color:#fff;border-color:var(--forest)}
.btn.g{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.btn.red{background:var(--maple);color:#fff;border-color:var(--maple)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.5}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer;min-height:36px}
.chip[aria-pressed=true]{background:var(--forest);color:#fff;border-color:var(--forest)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px;overflow-x:auto;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;cursor:pointer;white-space:nowrap;font-weight:500;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px #0002}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font:700 28px/1.1 "Barlow Condensed";font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--mute)}
.kpi i{font-style:normal;font-size:12px;color:var(--mute);display:block}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--chip)}
.tw{overflow-x:auto}
.meta{font-size:13px;color:var(--mute)}
.small{font-size:13px;color:var(--mute)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);white-space:nowrap}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;background:var(--chip);border:1px solid var(--line)}
.no{display:inline-block;background:var(--o);color:#fff;border-radius:7px;padding:2px 8px;font-weight:700;font-size:14px}
.empty{color:var(--mute);text-align:center;padding:24px 10px}
.err{color:var(--maple);font-size:14px;margin-top:6px}.ok{color:var(--leaf);font-size:14px;margin-top:6px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:flex;align-items:center;gap:10px;border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));background:color-mix(in srgb,var(--c) 9%,var(--card));border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font-weight:600;min-height:52px}
.cat svg{color:var(--c);flex:none}
.cat[aria-pressed=true]{outline:3px solid var(--c);outline-offset:1px}
.punch{width:190px;height:190px;border-radius:50%;border:0;margin:22px auto 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font:700 21px "Barlow Condensed";cursor:pointer;box-shadow:0 8px 24px #0003;background:var(--leaf)}
.punch.out{background:var(--maple)}
.punch:disabled{opacity:.45}
.timer{font:700 44px/1 "Barlow Condensed";text-align:center;font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--leaf);box-shadow:0 0 0 4px color-mix(in srgb,var(--leaf) 25%,transparent);flex:none}
.day{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card);overflow:hidden}
.dayh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.dayh b{font-size:17px;min-width:110px}
.dayb{padding:0 14px 14px;border-top:1px solid var(--line)}
.sheet-bg{position:fixed;inset:0;background:#0007;z-index:200;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:761px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sheet h2{font-size:24px}
#plmap{height:420px;border-radius:12px;border:1px solid var(--line)}
@media (max-width:760px){#plmap{height:300px}}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:10px}
.bars{justify-content:center}.bars div{flex:1;max-width:46px;background:var(--forest2);border-radius:4px 4px 0 0;min-width:4px;position:relative}
.prof{width:100%;height:120px;display:block}
.gate{position:fixed;inset:0;background:var(--forest);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.gate.on{display:flex}
.gate .card{max-width:400px;width:100%}
.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:400;display:none;max-width:90%;text-align:center}
.toast.on{display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:18px;height:4px;border-radius:2px;display:inline-block}
/* Vue TV */
body.tv{padding:0;background:#0b120e;color:#eaf2ec;overflow:hidden}
body.tv header,body.tv nav{display:none}
.tvw{height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:2.2vh 2.5vw;gap:2vh}
.tvh{display:flex;align-items:center;gap:1.5vw}
.tvh h1{font-size:4.2vh;flex:1}
.tvclock{font:700 6vh/1 "Barlow Condensed";font-variant-numeric:tabular-nums}
.tvg{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:1.6vh 1.2vw}
.tvt{background:#15201a;border:1px solid #23342a;border-radius:2vh;padding:2vh 1.5vw;display:flex;flex-direction:column;justify-content:space-between;min-height:0;overflow:hidden}
.tvt span{font-size:2.3vh;color:#9fb5a7;text-transform:uppercase;letter-spacing:.1vh}
.tvt b{white-space:nowrap;font:700 7.5vh/1 "Barlow Condensed";font-variant-numeric:tabular-nums}
.tvt b small{font-size:3.5vh;color:#9fb5a7}
.tvt.w2{grid-column:span 2}
.tvt.w2{justify-content:flex-start;gap:1.5vh}.tvt ul{list-style:none;margin:0;padding:0;font-size:2.8vh;overflow:hidden}
.tvt li{padding:.5vh 0;border-bottom:1px solid #23342a;display:flex;gap:1vw}
.tvf{font-size:2.4vh;color:#9fb5a7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaflet-tooltip.lbl{background:#fff;border:0;border-radius:6px;font-weight:700;font-size:12px;padding:2px 6px;box-shadow:0 1px 4px #0005;color:#111}
</style>
